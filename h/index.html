<!doctype html>
 <html lang="zh-CN">
 <head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
 <title>恒轩影视</title>
 <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
 <style>
 *{box-sizing:border-box}
 body{margin:0;color:#fff;background:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif}
 .app{padding:18px 18px 30px;min-height:100vh;background:linear-gradient(135deg,rgba(5,12,25,.82),rgba(9,42,42,.72))}
 .top-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
 .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
 .logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#00f5a0,#00d9f5);display:grid;place-items:center;color:#001;font-weight:900}
 .icon-btn,.tab,.card,.ep{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);color:#fff;border-radius:14px}
 .icon-btn{height:38px;padding:0 14px;display:none;}
 .search-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;margin-bottom:12px}
 .cfg-btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);color:#fff;border-radius:14px;height:38px;padding:0 14px}
 input{width:100%;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.24);color:#fff;border-radius:14px;padding:11px 12px;outline:none}
 .tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}
 .tab{white-space:nowrap;padding:9px 13px}
 .tab.active{background:linear-gradient(135deg,#00d9f5,#00f5a0);color:#001;font-weight:800}
 .section-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
 h2{font-size:18px;margin:0}
 .hint{font-size:12px;color:rgba(255,255,255,.62)}
 #content{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px}
 .card{overflow:hidden;text-align:left;padding:0}
 .poster{width:100%;aspect-ratio:2/3;background:rgba(255,255,255,.08);object-fit:cover;display:block}
 .card-info{padding:8px}
 .name{font-size:14px;font-weight:700;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .remark{margin-top:5px;font-size:12px;color:rgba(255,255,255,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .empty{grid-column:1/-1;text-align:center;color:rgba(255,255,255,.62);padding:40px 0}
 .sheet{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;z-index:20;align-items:flex-end}
 .sheet.show{display:flex}
 .detail-panel{width:100%;max-height:86vh;overflow:auto;background:linear-gradient(180deg,rgba(18,28,40,.96),rgba(8,14,22,.98));backdrop-filter:blur(16px);border-radius:24px 24px 0 0;border:1px solid rgba(255,255,255,.12);padding:18px}
 .detail-top{display:grid;grid-template-columns:110px 1fr;gap:14px}
 .detail-pic{width:110px;border-radius:14px;aspect-ratio:2/3;object-fit:cover;background:#17202c}
 .detail-title{font-size:20px;font-weight:900;margin-bottom:8px}
 .meta{font-size:13px;color:rgba(255,255,255,.72);line-height:1.55}
 .desc{margin:12px 0;font-size:13px;color:rgba(255,255,255,.75);line-height:1.6}
 .eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:9px;margin-bottom:16px;}
 .ep{padding:10px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .ep.active{background:linear-gradient(135deg,#00d9f5,#00f5a0);color:#000;}
 .pager{display:flex;gap:10px;justify-content:center;align-items:center;margin:18px 0 4px}
 .pager button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);color:#fff;border-radius:14px;padding:10px 18px}
 .pager button:disabled{opacity:.38}
 .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:10px 14px;border-radius:999px;display:none;z-index:30}
 #playerWrap{width:100%;background:#000;border-radius:14px;overflow:hidden;margin:12px 0;display:none;}
 #videoPlayer{width:100%;display:block;}
 
 .filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
 .filter-item{padding:6px 10px;border-radius:8px;background:rgba(255,255,255,0.1);font-size:12px}
 .filter-item.active{background:#00d9f5;color:#000}
 </style>
 </head>
 <body>
<main class="app">
    <div class="top-title">
      <div class="brand"><div class="logo">HX</div><div>恒轩影视</div></div>
      <button class="icon-btn" id="configBtn">设置</button>
    </div>
    <div class="search-row">
      <button class="cfg-btn" id="homeBtn">首页</button>
      <form id="searchForm"><input id="kw" placeholder="搜索电影 / 电视剧 / 动漫 / 综艺"></form>
      <button class="cfg-btn" id="searchBtn">搜索</button>
    </div>
    
    <div id="filterBar" class="filter-bar"></div>
    <div class="tabs" id="tabs"></div>
    <div class="section-head"><h2 id="sectionTitle">精选</h2><div class="hint" id="status">就绪</div></div>
    <section id="content"></section>
    <div class="pager" id="pager">
      <button id="prevPage">上一页</button>
      <span id="pageText">第 1 页</span>
      <button id="nextPage">下一页</button>
    </div>
  </main>
  <div class="sheet" id="detailSheet">
    <div class="detail-panel" id="detailPanel">
      <div id="playerWrap">
        <video id="videoPlayer" controls></video>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
 <script>
 
 const rule = {
     title: '恒轩影视',
     host: 'https://v.qq.com',
     homeUrl: '/x/bu/pagesheet/list?_all=1&append=1&channel=cartoon&listpage=1&offset=0&pagesize=21&iarea=-1&sort=18',
     detailUrl: 'https://node.video.qq.com/x/api/float_vinfo2?cid=fyid',
     searchUrl: '**',
     searchable: 2,
     filterable: 1,
     multi: 1,
     url: '/x/bu/pagesheet/list?_all=1&append=1&channel=fyclass&listpage=1&offset=((fypage-1)*21)&pagesize=21&iarea=-1',
     filter_url: 'sort={{fl.sort or 75}}&iyear={{fl.iyear}}&year={{fl.year}}&itype={{fl.type}}&ifeature={{fl.feature}}&iarea={{fl.area}}&itrailer={{fl.itrailer}}&gender={{fl.sex}}',
     parse_url: [
         'https://json.xophp.com/api/?key=5492ef7d5a1646338426e2f45b8c8e0d&url=',
         'http://global.apirun.xn--vsqw5hh18a8vw.com:2025/api/?key=63c856aac8b205a5cb972ae8950cfd78&url=',
         'https://json.cfysoft.cc/api/?key=db40a4b2f15c4078301a068181bb2724&url=',
         'http://103.236.72.166:188/api/?key=veniDOaEzSzIThZsyb&url=',
         'http://111.170.140.70:1332/?url='
     ],
     headers: {
         'User-Agent': 'PC_UA'
     },
     timeout: 5000,
     cate_exclude: '会员|游戏|全部',
     class_name: '精选&电影&电视剧&综艺&动漫&少儿&纪录片',
     class_url: 'choice&movie&tv&variety&cartoon&child&doco',
     limit: 20,
play_parse: true,
     filter: {
         "choice": [{
            "key": "sort",
             "name": "排序",
             "value": [{"n": "最热","v": "75"},{"n": "最新","v": "83"},{"n": "好评","v": "81"}]
          }]
             }
 };
 
 const BASE='https://v.qq.com',
 API='https://node.video.qq.com',
 CATS = rule.class_name.split('&').map((name,i)=>[rule.class_url.split('&')[i], name]),
 UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36';
 let activeCat='choice',page=1,lastList=[],currentDetail=null,currentHls=null;
 
 let filterParams = {
sort: "75",
     iyear: "-1",
     year: "-1",
     type: "-1",
     feature: "-1",
     area: "-1",
     itrailer: "-1",
     sex: "-1"
 };
 
 const $=s=>document.querySelector(s),
 esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),
 clean=s=>String(s||'').trim(),
 abs=u=>!u?'':/^https?:/i.test(u)?u:u.startsWith('//')?'https:'+u:new URL(u,BASE).href;
 function toast(s){
   $('#toast').textContent=s;
   $('#toast').style.display='block';
   setTimeout(()=>$('#toast').style.display='none',1600)
 }
 function setStatus(s){$('#status').textContent=s}
 function destroyPlayer(){
   if(currentHls){
     currentHls.destroy();
     currentHls=null;
   }
   $('#videoPlayer').src = '';
   $('#playerWrap').style.display = 'none';
 }
 async function req(url,opt={}){
   let o=Object.assign({headers:{'User-Agent':UA,'Referer':BASE+'/'}},opt);
   let r=await fetch(url,o);
   return await r.text()
 }
 async function json(url,opt={}){
   let t=await req(url,opt);
   return JSON.parse(t.replace(/^QZOutputJson=/,'').replace(/;\s*$/,''))
 }
 
 function renderTabs(){
   $('#tabs').innerHTML=CATS.map(x=>`<button class="tab ${activeCat===x[0]?'active':''}" data-id="${x[0]}">${x[1]}</button>`).join('');
   $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
     activeCat=b.dataset.id;
     
     resetFilter();
     page=1;
     renderTabs();
     renderFilter();
     loadCategory()
   })
 }
 
 function renderFilter(){
   const filterConf = rule.filter[activeCat] || [];
   let filterHtml = '';
   filterConf.forEach(group=>{
     filterHtml += `<div style="margin:4px 0">${group.name}：`;
     group.value.forEach(item=>{
       const curVal = filterParams[group.key];
       filterHtml += `<span class="filter-item ${curVal===item.v?'active':''}" data-key="${group.key}" data-val="${item.v}">${item.n}</span>`
     })
     filterHtml += `</div>`;
   })
   $('#filterBar').innerHTML = filterHtml;
$('#filterBar').querySelectorAll('.filter-item').forEach(el=>{
     el.onclick = ()=>{
       filterParams[el.dataset.key] = el.dataset.val;
       page = 1;
       renderFilter();
       loadCategory();
     }
   })
 }
 
 function resetFilter(){
   filterParams = {
     sort: "75",
     iyear: "-1",
     year: "-1",
     type: "-1",
     feature: "-1",
     area: "-1",
     itrailer: "-1",
     sex: "-1"
   };
 }
 
 function parseCards(html,cat){
   let arr=[],
   ms=String(html||'').match(/<div[^>]*class=["']?list_item["']?[^>]*>[\s\S]*?<\/div>/gi)||[];
   ms.forEach(it=>{
     let n=(it.match(/<img[^>]*alt=["']?([^"']*)/i)||[])[1]||'',
     p=(it.match(/<img[^>]*src=["']?([^"'\s>]+)/i)||[])[1]||'',
     u=(it.match(/<a[^>]*data-float=["']?([^"'\s>]+)/i)||[])[1]||(it.match(/href=["']?([^"'\s>]+)/i)||[])[1]||'',
     d=(it.match(/<a[^>]*>([\s\S]*?)<\/a>/i)||[])[1]||'';
     if(n&&p)arr.push({
       vod_id:(cat?cat+'$':'')+u,
       vod_name:n,
       vod_pic:abs(p),
       vod_remarks:d.replace(/<[^>]+>/g,'').trim()
     })
   });
   return arr
 }
 async function loadCategory(){
   setStatus('加载中');
   $('#sectionTitle').textContent=(CATS.find(x=>x[0]===activeCat)||CATS[0])[1];
   $('#content').innerHTML='<div class="empty">加载中...</div>';
   let ch=activeCat==='choice'?'cartoon':activeCat,
   off=(page-1)*21;
   
   let filterQuery = `sort=${filterParams.sort}&iyear=${filterParams.iyear}&year=${filterParams.year}&itype=${filterParams.type}&ifeature=${filterParams.feature}&iarea=${filterParams.area}&itrailer=${filterParams.itrailer}&gender=${filterParams.sex}`;
   let u=`${BASE}/x/bu/pagesheet/list?_all=1&append=1&channel=${encodeURIComponent(ch)}&listpage=${page}&offset=${off}&pagesize=21&iarea=-1&${filterQuery}`;
   try{
     let h=await req(u);
     lastList=parseCards(h,ch);
     renderCards(lastList);
     updatePager(lastList.length>=21);
     setStatus('第 '+page+' 页')
   }catch(e){
     $('#content').innerHTML='<div class="empty">加载失败</div>';
     updatePager(false);
     setStatus('失败')
   }
 }
function renderCards(arr){
   $('#content').innerHTML=arr.length?arr.map((v,i)=>`<button class="card" data-i="${i}">
     <img class="poster" src="${esc(v.vod_pic)}">
     <div class="card-info">
       <div class="name">${esc(v.vod_name)}</div>
       <div class="remark">${esc(v.vod_remarks)}</div>
     </div>
   </button>`).join(''):'<div class="empty">暂无内容</div>';
   $('#content').querySelectorAll('.card').forEach(b=>b.onclick=()=>openDetail(lastList[+b.dataset.i]))
 }
 function updatePager(hasNext){
   if(!$('#pager'))return;
   $('#pager').style.display=$('#kw').value.trim()?'none':'flex';
   $('#pageText').textContent='第 '+page+' 页';
   $('#prevPage').disabled=page<=1;
   $('#nextPage').disabled=!hasNext
 }
 
 async function batchInfo(vids){
   let out=[];
   for(let i=0;i<vids.length;i+=30){
     let b=vids.slice(i,i+30);
     try{
       let j=await json(`https://union.video.qq.com/fcgi-bin/data?otype=json&tid=1804&appid=20001238&appkey=6c03bbe9658448a4&union_platform=1&idlist=${b.join(',')}`);
       (j.results||[]).forEach(x=>{
         let f=x.fields||{};
         out.push({vid:f.vid,title:f.title,type:f.category_map&&f.category_map.length>1?f.category_map[1]:''})
       })
     }catch(e){}
   }
   return out
 }
 async function openDetail(v){
   destroyPlayer();
   $('#detailSheet').classList.add('show');
   $('#detailPanel').innerHTML='<div class="empty">详情加载中...</div><div id="playerWrap"><video id="videoPlayer" controls></video></div>';
   let raw=String(v.vod_id||''),
   sp=raw.split('$'),
   cid=sp[1]||sp[0];
   try{
     let j=await json(`${API}/x/api/float_vinfo2?cid=${encodeURIComponent(cid)}`),
     c=j.c||{},
     vids=c.video_ids||[],
     infos=await batchInfo(vids),
     ordered=vids.map(x=>infos.find(y=>y.vid===x)||{vid:x,title:'',type:''});
     
     const ygKeywords = ["预告", "花絮", "片花", "特辑", "幕后", "采访", "制作", "MV", "主题曲"];
     let main=ordered.filter(x=>!x.type || !ygKeywords.some(k=>x.type.includes(k)));
     let epsList = main.map((it,i)=>{
       let num = /^\d+$/.test(it.title) ? it.title : (i+1);
       return {
         name: `第${num}集`,
         url:`${BASE}/x/cover/${cid}/${it.vid}.html`
       }
     });
     currentDetail={
vod:{
         vod_id:raw,
         vod_name:c.title||v.vod_name||'',
         vod_pic:abs(c.pic||v.vod_pic||''),
         vod_remarks:j.rec||v.vod_remarks||'',
         vod_year:c.year||'',
         type_name:(j.typ||[]).join(','),
         vod_actor:(j.nam||[]).join(','),
         vod_content:c.description||''
       },
       eps: epsList
     };
 renderDetail();
     if(epsList.length>0) playEpisode(0);
   }catch(e){
     $('#detailPanel').innerHTML='<div class="empty">详情加载失败</div><div id="playerWrap"><video id="videoPlayer" controls></video></div>'
   }
 }
 function renderDetail(){
   let d=currentDetail.vod,
   eps=currentDetail.eps;
   $('#detailPanel').innerHTML=`
     <div id="playerWrap"><video id="videoPlayer" controls></video></div>
     <div class="detail-top">
       <img class="detail-pic" src="${esc(d.vod_pic)}">
       <div>
         <div class="detail-title">${esc(d.vod_name)}</div>
         <div class="meta">${esc([d.type_name,d.vod_year,d.vod_actor,d.vod_remarks].filter(Boolean).join(' · '))}</div>
       </div>
     </div>
     <div class="desc">${esc(d.vod_content||'暂无简介')}</div>
     <div class="eps" id="eps"></div>
   `;
   $('#eps').innerHTML=eps.map((e,i)=>`<button class="ep" data-i="${i}">${esc(e.name)}</button>`).join('');
   $('#eps').querySelectorAll('.ep').forEach(b=>b.onclick=()=>playEpisode(+b.dataset.i));
 }
 
 async function getPlayUrl(pageUrl){
   let targetUrl = pageUrl.split("?")[0];
   // 循环遍历rule.parse_url多接口
   for(let i=0;i<rule.parse_url.length;i++){
     let parseUrl = rule.parse_url[i] + encodeURIComponent(targetUrl);
     try{
       let resText = await req(parseUrl, {headers:{'Referer':'https://v.qq.com/'}});
       let resJson = JSON.parse(resText);
       if(resJson.url && resJson.url.startsWith("http")){
         return resJson.url;
       }
     }catch(err){
       continue;
     }
   }
   toast("全部解析接口失效");
   return null;
 }
 async function playEpisode(idx){
   destroyPlayer();
   let eps = currentDetail.eps;
   let item = eps[idx];
   if(!item)return;
   toast(`${item.name}`);
   let playSrc = await getPlayUrl(item.url);
   if(!playSrc)return;
document.querySelectorAll('.ep').forEach(el=>el.classList.remove('active'));
   document.querySelector(`.ep[data-i="${idx}"]`)?.classList.add('active');
   $('#playerWrap').style.display = 'block';
   const video = $('#videoPlayer');
   if(Hls.isSupported()){
     currentHls = new Hls();
     currentHls.loadSource(playSrc);
     currentHls.attachMedia(video);
     currentHls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
   }else if(video.canPlayType('application/vnd.apple.mpegurl')){
     video.src = playSrc;
     video.play();
   }
 }
 
 async function search(){
   let wd=clean($('#kw').value);
   if(!wd)return;
   setStatus('搜索中');
   $('#sectionTitle').textContent='搜索：'+wd;
   $('#filterBar').innerHTML = ''; 
   $('#content').innerHTML='<div class="empty">搜索中...</div>';
   try{
     
     let payload={
       version:'25042201',
       clientType:1,
       filterValue:"",
       uuid:"B1E50847-D25F-4C4B-BBA0-36F0093487F6",
       retry:0,
       query:wd,
       pagenum:0,
       pagesize:30,
       queryFrom:0,
       searchDatakey:"",
       transInfo:"",
       isneedQc:true,
       preQid:"",
       adClientInfo:"",
       extraInfo:{
         isNewMarkLabel:"1",
         multi_terminal_pc:"1",
         themeType:"1",
         sugRelatedIds:"{}",
         appVersion:""
       }
     };
     let t=await req('https://pbaccess.video.qq.com/trpc.videosearch.mobile_search.MultiTerminalSearch/MbSearch?vplatform=2',{
       method:'POST',
       headers:{
         'User-Agent':UA,
         'Content-Type':'application/json',
         'Origin':BASE,
         'Referer':BASE+'/'
       },
       body:JSON.stringify(payload)
     });
     let j=JSON.parse(t),
     arr=[],
     seenIds = new Set();
     
     const nonMainContentKeywords = ['：', '#', '特辑', '剪辑', '片花', '独家', '专访', '纯享','制作', '幕后', '宣传', 'MV', '主题曲', '插曲', '彩蛋','精彩', '集锦', '盘点', '回顾', '解说', '评测', 'reaction'];
function isMainContent(title) {
       if (!title) return false;
       if (title.includes('<em>') || title.includes('</em>')) return false;
       return !nonMainContentKeywords.some(keyword => title.includes(keyword));
     }
     function pushItem(it){
       if(it&&it.doc&&it.doc.id&&it.videoInfo&&isMainContent(it.videoInfo.title)){
         const itemId = it.doc.id;
         if (!seenIds.has(itemId)) {
           seenIds.add(itemId);
           arr.push({
             vod_id:itemId,
             vod_name:(it.videoInfo.title||'').replace(/<\/?em>/g,''),
             vod_pic:it.videoInfo.imgUrl||'',
             vod_remarks:it.videoInfo.secondLine||it.videoInfo.firstLine||''
           })
         }
       }
     }
     (((j.data||{}).normalList||{}).itemList||[]).forEach(pushItem);
     ((j.data||{}).areaBoxList||[]).forEach(a=>(a.itemList||[]).forEach(pushItem));
     lastList=arr;
     renderCards(arr);
     $('#pager').style.display='none';
     setStatus(arr.length+' 条结果')
   }catch(e){
     $('#content').innerHTML='<div class="empty">搜索失败</div>';
     setStatus('失败')
   }
 }
 
 $('#detailSheet').onclick=e=>{
   if(e.target===$('#detailSheet')){
     destroyPlayer();
     $('#detailSheet').classList.remove('show');
   }
 };
 $('#searchForm').onsubmit=e=>{e.preventDefault();search()};
 $('#searchBtn').onclick=search;
 $('#prevPage').onclick=()=>{if(page>1){page--;loadCategory();scrollTo(0,0)}};
 $('#nextPage').onclick=()=>{page++;loadCategory();scrollTo(0,0)};
 $('#homeBtn').onclick=()=>{
   $('#kw').value='';
   page=1;
   resetFilter();
   renderFilter();
   loadCategory()
 };
 $('#configBtn').onclick=()=>{};
 
 renderTabs();
 renderFilter();
 loadCategory();
 </script>
 </body>
 </html>
