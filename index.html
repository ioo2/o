<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恒轩影视</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --success: #2ea043;
      --primary: #238636;
      --secondary: #1f6feb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background-color: #0a0e14;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.45);
    }
    .header {
      text-align: center;
      margin-bottom: 22px;
    }
    .header a {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg,#58a6ff,#3fb950);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
      letter-spacing:2px;
    }
    .header a:hover {
      filter: brightness(1.2);
    }
    .badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 30px;
      background: rgba(46,160,67,0.18);
      color: #3fb950;
      font-size: 12px;
      margin-top: 6px;
      font-weight: bold;
    }
    .box {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .box-title {
      font-size: 14px;
      color: #8b949e;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .spoiler-container {
      position: relative;
      background: #161b22;
      border-radius: 14px;
      border: 1px dashed var(--border);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }
    .url-text {
      word-break: break-all;
      font-family: monospace;
      font-size: 14px;
      color: #79c0ff;
      padding: 12px 20px;
      display: block;
      text-align: center;
    }
    .spoiler-overlay {
      position: absolute;
      inset: 0;
      background-color: #21262d;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 0),
        radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 0);
      background-size: 6px 6px;
      background-position: 0 0, 3px 3px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b949e;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }
    .spoiler-overlay::after { content: "🔒 点击显示接口"; }
    .spoiler-container.revealed .spoiler-overlay {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.04);
    }
    .spoiler-container.revealed { user-select: text; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: normal;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: 0.2s;
      margin-top: 14px;
    }
    .btn-copy { background: #238636; color: #fff; }
    .btn-copy:hover { background: #2ea043; }
    .step-item {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.4;
      color: #c9d1d9;
      align-items: center;
    }
    .step-num {
      width: 32px;
      height: 32px;
      background: var(--accent);
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
      font-size: 12px;
    }
    .download-row {
      display: flex;
      gap: 36px;
      justify-content: center;
      margin-top:22px;
    }
    .download-row a {
      color:#79c0ff;
      font-size:14px;
      text-decoration:none;
      border:1px solid var(--border);
      padding:4px 10px;
      border-radius:6px;
      opacity:0.9;
      transition:0.2s;
    }
    .download-row a:hover{opacity:1;color:#a0d4ff;}
    .link-title-wrap{
      display:block;
      width:100%;
      padding:12px;
      border:none;
      border-radius:14px;
      background:#238636;
      color:#fff;
      text-align:center;
      font-size:14px;
      margin:28px 0 12px;
    }
    .link-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .link-grid a {
      text-align:center;
      color:#39ff66;
      font-weight:bold;
      font-size:12px;
      text-decoration:none;
      border:1px solid var(--border);
      padding:4px 6px;
      border-radius:6px;
      transition:0.2s;
    }
    .link-grid a:hover{color:#68ff8c;}
    .hidden { display: none; }
    @media (max-width:520px){
      .link-grid{grid-template-columns:repeat(2,1fr);}
    }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
       <a href="https://hxys.cc.cd/o" target="_blank">恒轩影视</a>
    </div>
    <div class="box">
      <div class="spoiler-container" id="spoilerBox" onclick="toggleSpoiler()">
        <div class="spoiler-overlay" id="spoilerMask"></div>
        <div class="url-text" id="subUrl">https://hxys.cc.cd/c</div>
      </div>
      <button class="btn btn-copy" onclick="copyUrl()">📋 一键复制接口地址</button>
    </div>
    <div class="box">
      <div class="box-title">配置教程</div>
      <div class="step-item">
        <div class="step-num">1</div>
        <div>打开客户端，进入 设置 -&gt; 点播。</div>
      </div>
      <div class="step-item">
        <div class="step-num">2</div>
        <div>扫码或粘贴链接，填入配置框。</div>
      </div>
      <div class="step-item">
        <div class="step-num">3</div>
        <div>保存后即可加载影视资源。</div>
      </div>
      <div class="download-row">
        <a href="https://share.feijipan.com/s/k26KsgOr" target="_blank">手机版下载</a>
        <a href="https://share.feijipan.com/s/Yh6KpMBl" target="_blank">电视版下载</a>
      </div>
    </div>
    <div class="link-title-wrap">在线影视</div>
    <div class="link-grid">
      <a href="https://www.kankanya.me/" target="_blank">看鸭影视</a>
      <a href="https://juok3.top/" target="_blank">剧吧影视</a>
      <a href="kanju17.com/" target="_blank">看剧影视</a>
      <a href="https://www.kkys01.com/" target="_blank">可可影视</a>
    </div>
  </div>
<script>
    function toggleSpoiler() {
      const box = document.getElementById('spoilerBox');
      box.classList.toggle('revealed');
    }
    async function copyUrl() {
      const url = document.getElementById('subUrl').innerText;
      document.getElementById('spoilerBox').classList.add('revealed');
      let copySuccess = false;
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(url);
          copySuccess = true;
        } catch (e) {
          copySuccess = false;
        }
      }
      if(!copySuccess){
        const textarea = document.createElement('textarea');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.opacity = '0.01';
        textarea.value = url;
        document.body.appendChild(textarea);
        textarea.select();
        try{
          copySuccess = document.execCommand('copy');
        }catch(err){
          copySuccess = false;
        }
        document.body.removeChild(textarea);
      }
      if(copySuccess){
        alert('✅ 接口地址已成功复制到剪贴板！');
      }else{
        alert('❌ 复制失败，请手动长按链接复制！');
      }
    }
</script>
</body>
</html>
